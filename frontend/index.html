<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <div class="sub-container">
        <span class="title">Book Management System</span>
        <form action="" class="form">
          <div class="form-row">
            <label for="book-title">Title</label>
            <input type="text" name="book-title" id="book-title" />
          </div>
          <div class="book-info">
            <div>
              <label for="book-author">Author</label>
              <input type="text" name="book-author" id="book-author" />
            </div>
            <div>
              <label for="year">Year</label>
              <input type="date" name="year" id="year" />
            </div>
            <div>
              <button type="submit" class="add-book-btn">Add Book</button>
            </div>
          </div>
          <div class="form-row">
            <table>
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Author</th>
                  <th>Year</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>The Great Gatsby</td>
                  <td>F.Scott Fitzgerald</td>
                  <td>1925</td>
                  <td class="actions-btns">
                    <button class="edit-btn">Edit</button>
                    <button class="delete-btn">Delete</button>
                  </td>
                </tr>
                <tr>
                  <td>The Great Gatsby</td>
                  <td>F.Scott Fitzgerald</td>
                  <td>1925</td>
                  <td class="actions-btns">
                    <button class="edit-btn">Edit</button>
                    <button class="delete-btn">Delete</button>
                  </td>
                </tr>
                <tr>
                  <td>The Great Gatsby</td>
                  <td>F.Scott Fitzgerald</td>
                  <td>1925</td>
                  <td class="actions-btns">
                    <button class="edit-btn">Edit</button>
                    <button class="delete-btn">Delete</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </form>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
